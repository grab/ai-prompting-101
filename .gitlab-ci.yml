image: node:20-alpine

stages:
  - build
  - deploy

build-gitlab:
  stage: build
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - out/
    expire_in: 1 hour

build-github:
  stage: build
  variables:
    NEXT_BASE_PATH: /ai-prompting-101
  script:
    - npm ci
    - npm run build
    - mv out out-github
  artifacts:
    paths:
      - out-github/
    expire_in: 1 hour

pages:
  stage: deploy
  needs: [build-gitlab]
  script:
    - cp -r out public
  artifacts:
    paths:
      - public
  only:
    - master
    - main

deploy-github:
  stage: deploy
  needs: [build-github]
  script:
    - apk add --no-cache git
    - git config --global user.email "ci@gitlab"
    - git config --global user.name "GitLab CI"
    - cd out-github
    - touch .nojekyll
    - git init
    - git add -A
    - git commit -m "Deploy to GitHub Pages"
    - git push --force "https://oauth2:${GL_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:gh-pages
  only:
    - master
    - main
